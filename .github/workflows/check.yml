# Working agreement, institutionalised: verify in a clean environment.
# The predecessor's suite was green locally and broken in CI, because a test
# imported a module that pulled a dependency CI did not install.
name: check
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pytest
